name: CNN Model CI Pipeline

on:
  push:
    branches: [ "main", "Samiun-Mahmud" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install CI Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy>=1.24.0 matplotlib>=3.8.0 scikit-learn>=1.3.0 pillow>=10.0.0

    - name: Verify Project Structure
      run: |
        echo "Checking required files exist..."
        test -f src/model.py       && echo "✓ src/model.py"
        test -f src/data_loader.py && echo "✓ src/data_loader.py"
        test -f src/train.py       && echo "✓ src/train.py"
        test -f src/evaluate.py    && echo "✓ src/evaluate.py"
        test -f src/predict.py     && echo "✓ src/predict.py"
        test -f src/augment.py     && echo "✓ src/augment.py"
        test -f tests/test_model.py && echo "✓ tests/test_model.py"
        echo "All required files present."

    - name: Run Unit Tests (TensorFlow optional)
      run: |
        python -m unittest discover -s tests -p "test_*.py" -v
      env:
        PYTHONPATH: ${{ github.workspace }}
